name: mmomenta
channels:
  - pytorch
  - nvidia
  - conda-forge
  - psi4
  - defaults
dependencies:
  - python=3.11
  - pip
  - mamba
  - numpy
  - scipy
  - pandas
  - matplotlib
  - seaborn
  - jupyter
  - rdkit
  - openbabel
  - psi4
  - pygdma
  - h5py
  - pytables
  - joblib
  - pytorch
  - pytorch-cuda=11.8
  # OpenFF dependencies
  - packaging
  - openff-forcefields
  - openff-amber-ff-ports
  - openff-units
  - openff-utilities
  - networkx
  - xmltodict
  - pymongo
  - python-constraint
  - cachetools
  - typing_extensions
  - openmm >=7.6
  - mdtraj
  - ambertools >=22
  - pip:
      - dgl -f https://data.dgl.ai/wheels/torch-2.6/cu118/repo.html
      # OpenFF packages will be installed from source via script
      # - openff-toolkit (from source)
      # - openff-interchange (from source)
      - openff-recharge

name: mmomenta
channels:
  - conda-forge
  - psi4
  - defaults
dependencies:
  - python=3.10
  - pip
  - numpy
  - scipy
  - pandas
  - matplotlib
  - seaborn
  - jupyter
  - rdkit
  - openbabel
  - psi4
  - h5py
  - pytables
  - joblib
  - pytorch
  - pytorch-cuda=11.8
  - pip:
      - dgl -f https://data.dgl.ai/wheels/torch-2.6/cu118/repo.html
      - openff-toolkit
      - openff-recharge
      - openff-units
